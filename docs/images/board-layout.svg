<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 790" width="1180" height="790" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Board layout, top view</title>
<desc id="d">To-scale placement on a 420 by 300 mm board: RSP-200-12 top left, LRS-150F-5 below it, Blue Sea 5026 fuse block on the right, inlet and AC lever nuts on the left edge, +5 V split and inline fuses bottom right, with 20 mm airflow clearance around each supply.</desc>
<rect x="0.5" y="0.5" width="1179" height="789" rx="12" fill="#fbfbf9" stroke="#d4d4cf"/>
