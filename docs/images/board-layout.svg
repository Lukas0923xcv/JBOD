</defs><text x="30" y="36" font-size="20" font-weight="700" fill="#1b1b1a" text-anchor="start" >Board layout (top view, to scale)</text>
<text x="30" y="58" font-size="12.5" font-weight="400" fill="#5c5c58" text-anchor="start" >Suggested placement on a 420 × 300 mm insulating board, mounted inside the earthed enclosure. Footprints are approximate: check your parts before drilling.</text>
<text x="30" y="76" font-size="12.5" font-weight="400" fill="#5c5c58" text-anchor="start" >Keep ≥ 20 mm around each supply for airflow (dashed outline). Terminal strips face the DC side to keep runs short.</text>
