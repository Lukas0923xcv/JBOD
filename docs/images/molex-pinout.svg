<line x1="264" y1="170" x2="264" y2="210" stroke="#6e0f0f" stroke-width="8" stroke-linecap="round"/>
<line x1="264" y1="170" x2="264" y2="210" stroke="#d62828" stroke-width="5" stroke-linecap="round"/>
<text x="180.0" y="158" font-size="10.5" font-weight="400" fill="#5c5c58" text-anchor="middle" >chamfered corners: keying only</text>
<text x="360" y="92" font-size="12" font-weight="700" fill="#5c5c58" text-anchor="start" >Pin</text>
