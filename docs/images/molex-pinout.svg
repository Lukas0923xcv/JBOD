<text x="434" y="212" font-size="12.5" font-weight="400" fill="#1b1b1a" text-anchor="start" >Red</text>
<text x="490" y="212" font-size="12.5" font-weight="600" fill="#1b1b1a" text-anchor="start" >+5 V</text>
<text x="570" y="212" font-size="12.5" font-weight="400" fill="#1b1b1a" text-anchor="start" >Inline fuse holder → +5 V WAGO split</text>
<text x="920" y="212" font-size="12.5" font-weight="400" fill="#5c5c58" text-anchor="start" >5 A inline fuse</text>
