<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 230" width="1080" height="230" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Molex pigtail pin-out</title>
<desc id="d">Pin 1 yellow +12 V to the fuse block through a 7.5 A fuse; pins 2 and 3 black ground to the negative bus; pin 4 red +5 V through a 5 A inline fuse.</desc>
<rect x="0.5" y="0.5" width="1079" height="229" rx="12" fill="#fbfbf9" stroke="#d4d4cf"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#1b1b1a" text-anchor="start" >Molex pigtail: pin-out and termination</text>
<text x="30" y="58" font-size="12.5" font-weight="400" fill="#5c5c58" text-anchor="start" >Same for A1 and A2. Check the colours against the moulded pin numbers before you crimp.</text>
