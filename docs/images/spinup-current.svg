<text x="60" y="281.3333333333333" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >6</text>
<line class="grid" x1="70" y1="231.0" x2="820" y2="231.0"/>
<text x="60" y="235.0" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >9</text>
<line class="grid" x1="70" y1="184.66666666666666" x2="820" y2="184.66666666666666"/>
<text x="60" y="188.66666666666666" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >12</text>
<line class="grid" x1="70" y1="138.33333333333334" x2="820" y2="138.33333333333334"/>
<text x="60" y="142.33333333333334" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >15</text>
<line class="grid" x1="70" y1="92.0" x2="820" y2="92.0"/>
<text x="60" y="96.0" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >18</text>
<text x="70.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >0</text>
<text x="145.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >2</text>
<text x="220.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >4</text>
<text x="295.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >6</text>
<text x="370.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >8</text>
<text x="445.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >10</text>
<text x="520.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >12</text>
<text x="595.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >14</text>
<text x="670.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >16</text>
<text x="745.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >18</text>
<text x="820.0" y="390" class="ink2" font-size="11.5" font-weight="400" text-anchor="middle" >20</text>
<line class="axis" x1="70" y1="370" x2="820" y2="370"/>
<text x="445.0" y="414" class="ink2" font-size="12" font-weight="400" text-anchor="middle" >seconds after power-on</text>
<text x="18" y="78" class="ink2" font-size="12" font-weight="400" text-anchor="start" >amps</text>
<line class="ref" x1="70" y1="112.07777777777778" x2="820" y2="112.07777777777778" stroke-width="1.5"/>
<text x="830" y="112.07777777777778" class="ink" font-size="12" font-weight="700" text-anchor="start" >16.7 A</text>
<text x="830" y="127.07777777777778" class="ink2" font-size="11" font-weight="400" text-anchor="start" >RSP-200-12 rating</text>
<line class="ref" x1="70" y1="176.94444444444446" x2="820" y2="176.94444444444446" stroke-width="1.5"/>
<text x="830" y="176.94444444444446" class="ink" font-size="12" font-weight="700" text-anchor="start" >12.5 A</text>
<text x="830" y="191.94444444444446" class="ink2" font-size="11" font-weight="400" text-anchor="start" >75 % target</text>
