<polyline class="s1" points="70.0,370.0 81.2,370.0 92.5,213.1 220.0,215.6 276.2,227.9 332.5,265.0 388.8,299.0 437.5,315.2 482.5,319.8 820.0,320.6" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
<circle class="f1" cx="92.5" cy="213.08444444444444" r="4.5"/>
<text x="107.5" y="191.08444444444444" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >≈ 10.2 A peak</text>
<text x="107.5" y="205.08444444444444" class="ink2" font-size="11.5" font-weight="400" text-anchor="start" >61 % of rating, 2.3 A below the 75 % target</text>
<text x="557.5" y="308.5777777777778" class="ink" font-size="12.5" font-weight="700" text-anchor="start" >≈ 3.2 A idle (19 %)</text>
<text x="557.5" y="342.5777777777778" class="ink2" font-size="11.5" font-weight="400" text-anchor="start" >5 V rail: steady ≈ 3.8 A throughout (17 % of the LRS-150F-5)</text>
<text x="317.5" y="252.62222222222223" class="ink2" font-size="11.5" font-weight="400" text-anchor="start" >platters reach speed</text>
