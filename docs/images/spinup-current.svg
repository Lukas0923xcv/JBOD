<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">12 V current during spin-up</title>
<desc id="d">Line chart: 12 V current jumps to about 10.2 A at power-on, holds for about 5 seconds, and settles to about 3.2 A idle by 10 seconds. The RSP-200-12 rating is 16.7 A and the 75 percent target is 12.5 A.</desc>
<style>
  .bg { fill: #fcfcfb; stroke: #dcdbd6; }
  .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .ink3 { fill: #7a7973; }
  .grid { stroke: #e6e5e0; } .axis { stroke: #9a9993; }
  .ref { stroke: #52514e; stroke-dasharray: 5 4; }
  .s1 { stroke: #2a78d6; } .f1 { fill: #2a78d6; } .a1 { fill: #2a78d6; opacity: .12; }
  .f2 { fill: #eb6834; } .conn { stroke: #9a9993; stroke-dasharray: 2 3; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #3a3a37; }
    .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .ink3 { fill: #9a998f; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #6b6a64; }
    .ref { stroke: #c3c2b7; }
    .s1 { stroke: #3987e5; } .f1 { fill: #3987e5; } .a1 { fill: #3987e5; opacity: .18; }
    .f2 { fill: #d95926; } .conn { stroke: #6b6a64; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="429" rx="12"/>
<text x="30" y="36" class="ink" font-size="18" font-weight="700" text-anchor="start" >12 V current during spin-up: 8 drives on the RSP-200-12</text>
<text x="30" y="58" class="ink2" font-size="12.5" font-weight="400" text-anchor="start" >Illustrative shape built from the per-drive figures (1.27 A peak, 0.40 A idle). Measure your own drives with a clamp meter.</text>
<line class="grid" x1="70" y1="370.0" x2="820" y2="370.0"/>
<text x="60" y="374.0" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >0</text>
<line class="grid" x1="70" y1="323.6666666666667" x2="820" y2="323.6666666666667"/>
<text x="60" y="327.6666666666667" class="ink2" font-size="11.5" font-weight="400" text-anchor="end" >3</text>
